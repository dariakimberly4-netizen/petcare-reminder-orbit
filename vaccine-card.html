<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c2d62">
  <title>PetCare Reminder — Vaccine Card</title>
  <style>
    :root{--blue:#123a91;--ink:#172033;--muted:#667085;--line:#dfe7ef;--bg:#f3f7fb;--green:#64d900}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:18px}.card{max-width:760px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 18px 50px rgba(18,58,145,.12)}.logo{display:block;width:min(210px,58vw);margin:0 auto 12px}.eyebrow{text-align:center;color:var(--blue);font-weight:900;letter-spacing:.1em}.pet{background:linear-gradient(145deg,#0d2b5c,#1649a0);color:#fff;border-radius:22px;padding:18px}.pet h1{margin:0 0 6px}.pet p{margin:3px 0;opacity:.92}.table-wrap{overflow:auto;margin-top:16px;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:520px}th,td{padding:11px;text-align:left;border-bottom:1px solid var(--line);font-size:.88rem}th{background:#f7f9fc;color:#475467}.note{margin-top:16px;padding:12px;border-radius:14px;background:#f5f7fa;color:#4b5563;font-size:.8rem}.status{text-align:center;color:var(--muted);padding:18px}.safe{display:inline-flex;margin:0 auto 12px;background:#eaf7ee;color:#166534;border:1px solid #ccebd5;border-radius:999px;padding:7px 11px;font-size:.72rem;font-weight:900}.center{text-align:center}@media(max-width:540px){body{padding:10px}.card{padding:14px;border-radius:20px}}
  </style>
  <script src="supabase-config.js?v=13" defer></script>
  <script src="vaccine-card.js?v=13" defer></script>
</head>
<body>
  <main class="card">
    <img class="logo" src="Pet-Family-Animal-Clinic-and-Grooming-Center.png" alt="Pet Family Animal Clinic and Grooming Center logo">
    <div class="center"><span class="safe">READ-ONLY VACCINE CARD</span></div>
    <div class="eyebrow">PETCARE REMINDER</div>
    <div id="cardContent" class="status">Loading vaccine card…</div>
    <div class="note">PetCare Reminder helps organize your pet's records and reminders. For medical advice, diagnosis, vaccination schedules, and treatment decisions, consult a licensed veterinarian.</div>
  </main>
</body>
</html>
